site_name: eGovernment.ai Standards
site_description: Open standards for responsible AI, knowledge systems, and learning.
site_url: https://standards.egovernment.ai

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow


exclude_docs: |
  README.md

plugins:
  - search
  - mermaid2
  - git-revision-date-localized

nav:
  - Home: index.md

  - Getting Started:
      - Overview: getting-started/index.md

  - Vision:
      - Overview: vision/index.md
      - Standards Vision: vision/VISION.md

  - Governance:
      - Overview: governance/index.md

  - Standards:
      - Overview: standards/index.md
      - EGS: standards/egs.md
      - CDF: standards/cdf.md
      - OKF: standards/okf.md
      - LEONIDAS: standards/leonidas.md

  - Catalog:
      - Standards Catalog: catalog/index.md

  - Conformance:
      - Overview: conformance/index.md

  - Manual:
      - EGS-0000 Standards Manual: manual/EGS-0000-eGovernment-ai-Standards-Manual.md

  - Roadmap:
      - Public Roadmap: roadmap/ROADMAP.md
